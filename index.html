<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks & Projects</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --surface: #fff;
      --surface-2: #f8f8fa;
      --text: #17181b;
      --muted: #737780;
      --border: #e4e6eb;
      --accent: #5b5bd6;
      --accent-soft: rgba(91,91,214,.12);
      --danger: #c94b58;
      --shadow: 0 18px 45px rgba(20,24,40,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101114;
        --surface: #18191d;
        --surface-2: #202126;
        --text: #f2f3f5;
        --muted: #9a9da7;
        --border: #2a2c32;
        --accent: #8b8bea;
        --accent-soft: rgba(139,139,234,.14);
        --danger: #ef7180;
        --shadow: 0 18px 45px rgba(0,0,0,.28);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }
    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 480px);
      gap: 24px;
      justify-content: center;
      align-items: start;
      padding: 28px 18px;
    }
    .sidebar, .app {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .sidebar {
      width: 280px;
      border-radius: 18px;
      padding: 20px;
      position: sticky;
      top: 28px;
    }
    .brand {
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.02em;
      margin-bottom: 22px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 11px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .07em;
    }
    .project-list {
      display: grid;
      gap: 8px;
    }
    .project {
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-2);
    }
    .project-name {
      font-weight: 700;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .project-description {
      color: var(--muted);
      font-size: 12px;
      margin: 3px 0 8px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .project-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .github-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .github-link:hover { text-decoration: underline; }
    .project-delete {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      font: inherit;
    }
    .project-delete:hover { color: var(--danger); background: rgba(201,75,88,.1); }
    .empty-projects {
      color: var(--muted);
      font-size: 13px;
      padding: 10px 2px 4px;
    }
    .add-project {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font: inherit;
      font-weight: 650;
    }
    .add-project:hover { background: var(--accent-soft); }
    .app {
      width: min(100%, 480px);
      border-radius: 20px;
      padding: 24px;
    }
    header { margin-bottom: 20px; }
    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -.04em;
    }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    form {
      display: flex;
      gap: 9px;
      margin-bottom: 18px;
    }
    input[type="text"], input[type="url"], textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea { resize: vertical; min-height: 74px; }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    button {
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }
    button:hover { filter: brightness(1.06); }
    button:active { transform: scale(.97); }
    form > button { padding: 0 16px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
    .task {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 52px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 13px;
      transition: opacity .25s ease, transform .25s ease, background .2s ease;
    }
    .task:hover { background: var(--accent-soft); }
    .check {
      appearance: none;
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      margin: 0;
      border: 1.7px solid var(--muted);
      border-radius: 50%;
      display: grid;
      place-content: center;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }
    .check::after {
      content: "";
      width: 9px;
      height: 5px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg) scale(0);
      opacity: 0;
      transition: transform .2s cubic-bezier(.2,.8,.2,1), opacity .15s ease;
    }
    .check:checked { border-color: var(--accent); background: var(--accent); transform: scale(1.05); }
    .check:checked::after { transform: rotate(-45deg) scale(1); opacity: 1; }
    .task-text { flex: 1; min-width: 0; word-break: break-word; transition: color .2s, opacity .2s; }
    .task.completed .task-text {
      color: var(--muted);
      opacity: .75;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }
    .delete {
      width: 32px;
      height: 32px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      font-weight: 400;
    }
    .delete:hover { color: var(--danger); background: rgba(201,75,88,.1); }
    .empty { padding: 24px 8px 10px; text-align: center; color: var(--muted); font-size: 14px; }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }
    .clear { padding: 0; background: transparent; color: var(--muted); font-weight: 550; }
    .clear:hover { color: var(--text); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.42);
      display: none;
      place-items: center;
      padding: 18px;
      z-index: 10;
    }
    .modal-backdrop.open { display: grid; }
    .modal {
      width: min(100%, 420px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0 0 4px; font-size: 20px; }
    .modal p { margin: 0 0 17px; color: var(--muted); font-size: 13px; }
    .modal form { display: grid; margin: 0; gap: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 3px; }
    .secondary { padding: 10px 14px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .primary { padding: 10px 14px; }
    .field-label { font-size: 12px; font-weight: 650; color: var(--muted); margin-bottom: -5px; }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: minmax(0, 480px);
        gap: 16px;
      }
      .sidebar {
        width: min(100%, 480px);
        position: static;
        order: 2;
      }
      .app { order: 1; }
    }
    @media (max-width: 420px) {
      body { padding: 16px 10px; }
      .app, .sidebar { padding: 18px; border-radius: 16px; }
      form { gap: 7px; }
      form > button { padding: 0 13px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Workspace</div>
      <div class="section-title">
        <span>Projects</span>
        <span id="projectCount">0</span>
      </div>
      <div id="projectList" class="project-list"></div>
      <button id="addProjectButton" class="add-project" type="button">+ Add GitHub repository</button>
    </aside>

    <main class="app">
      <header>
        <h1>My Tasks</h1>
        <p class="subtitle">Keep track of what needs to get done.</p>
      </header>

      <form id="taskForm">
        <input id="taskInput" type="text" placeholder="Add a task..." maxlength="160" autocomplete="off" aria-label="New task">
        <button type="submit">Add</button>
      </form>

      <ul id="taskList" aria-live="polite"></ul>

      <div class="footer">
        <span id="taskCount">0 tasks left</span>
        <button class="clear" id="clearCompleted" type="button">Clear completed</button>
      </div>
    </main>
  </div>

  <div id="projectModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="projectTitle">
    <section class="modal">
      <h2 id="projectTitle">Add GitHub repository</h2>
      <p>Add a project to your sidebar. It will be saved in this browser.</p>
      <form id="projectForm">
        <label class="field-label" for="repoName">Repository name</label>
        <input id="repoName" type="text" placeholder="e.g. DrawingPad" maxlength="80" required>

        <label class="field-label" for="repoDescription">Description</label>
        <textarea id="repoDescription" placeholder="What does this project do?" maxlength="240"></textarea>

        <label class="field-label" for="repoUrl">GitHub link</label>
        <input id="repoUrl" type="url" placeholder="https://github.com/username/repository" required>

        <div class="modal-actions">
          <button id="cancelProject" class="secondary" type="button">Cancel</button>
          <button class="primary" type="submit">Add project</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    const TASK_KEY = "polished-todo-tasks";
    const PROJECT_KEY = "polished-todo-projects";

    const defaultTasks = [
      { id: crypto.randomUUID(), text: "Finish my current project", completed: false },
      { id: crypto.randomUUID(), text: "Review today's priorities", completed: false },
      { id: crypto.randomUUID(), text: "Take a short break and recharge", completed: false }
    ];

    let tasks = load(TASK_KEY, defaultTasks);
    let projects = load(PROJECT_KEY, []);

    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    const count = document.getElementById("taskCount");
    const clearCompleted = document.getElementById("clearCompleted");

    const projectList = document.getElementById("projectList");
    const projectCount = document.getElementById("projectCount");
    const addProjectButton = document.getElementById("addProjectButton");
    const modal = document.getElementById("projectModal");
    const projectForm = document.getElementById("projectForm");
    const cancelProject = document.getElementById("cancelProject");
    const repoName = document.getElementById("repoName");
    const repoDescription = document.getElementById("repoDescription");
    const repoUrl = document.getElementById("repoUrl");

    function load(key, fallback) {
      try {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : fallback;
      } catch {
        return fallback;
      }
    }

    function save(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function renderTasks() {
      list.innerHTML = "";

      if (!tasks.length) {
        list.innerHTML = '<li class="empty">You’re all caught up. Add a task to get started.</li>';
      } else {
        tasks.forEach(task => {
          const item = document.createElement("li");
          item.className = `task${task.completed ? " completed" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.className = "check";
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.setAttribute("aria-label", `Complete ${task.text}`);

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const del = document.createElement("button");
          del.className = "delete";
          del.type = "button";
          del.setAttribute("aria-label", `Delete ${task.text}`);
          del.title = "Delete task";
          del.textContent = "×";

          checkbox.addEventListener("change", () => {
            task.completed = checkbox.checked;
            save(TASK_KEY, tasks);
            renderTasks();
          });

          del.addEventListener("click", () => {
            item.style.opacity = "0";
            item.style.transform = "translateX(10px)";
            setTimeout(() => {
              tasks = tasks.filter(t => t.id !== task.id);
              save(TASK_KEY, tasks);
              renderTasks();
            }, 180);
          });

          item.append(checkbox, text, del);
          list.appendChild(item);
        });
      }

      const remaining = tasks.filter(task => !task.completed).length;
      count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
    }

    function renderProjects() {
      projectList.innerHTML = "";
      projectCount.textContent = projects.length;

      if (!projects.length) {
        projectList.innerHTML = '<div class="empty-projects">Your GitHub projects will appear here.</div>';
        return;
      }

      projects.forEach(project => {
        const card = document.createElement("article");
        card.className = "project";

        const name = document.createElement("div");
        name.className = "project-name";
        name.textContent = project.name;

        const description = document.createElement("div");
        description.className = "project-description";
        description.textContent = project.description || "No description added.";

        const actions = document.createElement("div");
        actions.className = "project-actions";

        const link = document.createElement("a");
        link.className = "github-link";
        link.href = project.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "View on GitHub";

        const del = document.createElement("button");
        del.className = "project-delete";
        del.type = "button";
        del.textContent = "Remove";
        del.addEventListener("click", () => {
          projects = projects.filter(p => p.id !== project.id);
          save(PROJECT_KEY, projects);
          renderProjects();
        });

        actions.append(link, del);
        card.append(name, description, actions);
        projectList.appendChild(card);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.unshift({
        id: crypto.randomUUID(),
        text,
        completed: false
      });

      save(TASK_KEY, tasks);
      renderTasks();
      input.value = "";
      input.focus();
    });

    clearCompleted.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      save(TASK_KEY, tasks);
      renderTasks();
    });

    addProjectButton.addEventListener("click", () => {
      modal.classList.add("open");
      repoName.focus();
    });

    cancelProject.addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("open")) closeModal();
    });

    projectForm.addEventListener("submit", event => {
      event.preventDefault();

      let url = repoUrl.value.trim();
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;

      projects.unshift({
        id: crypto.randomUUID(),
        name: repoName.value.trim(),
        description: repoDescription.value.trim(),
        url
      });

      save(PROJECT_KEY, projects);
      renderProjects();
      projectForm.reset();
      closeModal();
    });

    function closeModal() {
      modal.classList.remove("open");
      projectForm.reset();
    }

    renderTasks();
    renderProjects();
  </script>
</body>
</html>
